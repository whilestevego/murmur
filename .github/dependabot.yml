version: 2

updates:
  # The workflow pins each action to a commit SHA. Dependabot updates the SHA and the version comment after it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # A new FluidAudio version can change pronunciations, so CI scores the NeMo cases on each of these pull requests.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
