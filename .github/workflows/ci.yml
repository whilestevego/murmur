name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the checks that are still running for an older commit on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # This is the Xcode version used for development. Pinning it keeps swift-format's rules the same in CI as locally.
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

# Each build job caches its build directory. The key changes with the Xcode version and the resolved dependencies, and
# a job with a new key starts from its last cache, so that only what changed is rebuilt.
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  build:
    name: Release build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ env.DEVELOPER_DIR }}-
      # This builds the binaries that make install copies. Package.resolved must be up to date.
      - run: swift build -c release --force-resolved-versions -Xswiftc -warnings-as-errors

  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-debug-${{ env.DEVELOPER_DIR }}-
      - run: swift test --force-resolved-versions -Xswiftc -warnings-as-errors

  sanitize:
    name: Tests with ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The thread sanitizer finds data races, and the address sanitizer finds memory errors in the code that uses
        # unsafe pointers.
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ matrix.sanitizer }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ matrix.sanitizer }}-${{ env.DEVELOPER_DIR }}-
      - run: swift test --force-resolved-versions --sanitize=${{ matrix.sanitizer }}

  nemo:
    name: NeMo normalization cases
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-nemo-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-nemo-${{ env.DEVELOPER_DIR }}-
      # Without an installed bundle, FluidAudio downloads the Kokoro model here, which is about 200 MB. The model changes
      # only with FluidAudio's version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/fluidaudio
          key: fluidaudio-models-${{ hashFiles('Package.resolved') }}
      - run: make nemo SHOW=1
